<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text or Next? - Let Destiny Decide</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
        body { 
            background: radial-gradient(circle at center, #0b112c 0%, #050714 100%); 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        /* Gece parıldayan yıldızlar */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.3; animation: blink 3s infinite ease-in-out; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        
        .container { 
            max-width: 450px; 
            width: 100%; 
            padding: 40px 25px; 
            background: rgba(255, 255, 255, 0.01); 
            border-radius: 20px; 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            z-index: 1;
        }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 30px; letter-spacing: -0.5px; color: rgba(255,255,255,0.95); }
        .btn { background: #fff; color: #050714; border: none; padding: 16px 35px; font-size: 1.1rem; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.5px; }
        .btn:hover { background: rgba(255,255,255,0.9); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.1); }
        .btn:disabled { background: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        
        #result-box { display: none; margin-top: 35px; animation: fadeIn 0.4s ease-out; }
        .decision-text { font-size: 3rem; font-weight: 900; letter-spacing: 4px; margin-bottom: 25px; text-transform: uppercase; }
        .text-style { color: #00ffaa; text-shadow: 0 0 20px rgba(0,255,170,0.4); }
        .next-style { color: #ff3366; text-shadow: 0 0 20px rgba(255,51,102,0.4); }
        .share-btn { display: inline-block; background: transparent; color: rgba(255,255,255,0.6); text-decoration: none; padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.85rem; transition: all 0.2s; }
        .share-btn:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Arka plandaki yıldızlar için alan -->
    <div class="stars" id="starContainer"></div>

    <div class="container">
        <h1>Should I text them?</h1>
        
        <button class="btn" id="decide-btn" onclick="makeDecision()">LET DESTINY DECIDE</button>

        <div id="result-box">
            <div id="decision" class="decision-text"></div>
            <a id="share-link" class="share-btn" href="#" target="_blank">𝕏 Share on X</a>
        </div>
    </div>

    <script>
        // Sayfa açıldığında arka plana rastgele parıldayan 80 tane yıldız yerleştiren fonksiyon
        function createStars() {
            const container = document.getElementById('starContainer');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Yıldız boyutları (1 ila 3 piksel arası nokta şeklinde)
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Rastgele konumlandırma
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                
                // Her yıldız farklı zamanlarda parıldasın diye rastgele gecikme süresi
                star.style.animationDelay = `${Math.random() * 3}s`;
                
                container.appendChild(star);
            }
        }
        // Yıldızları oluştur
        createStars();
        function makeDecision() {
            const btn = document.getElementById('decide-btn');
            const resultBox = document.getElementById('result-box');
            const decisionDiv = document.getElementById('decision');
            const shareLink = document.getElementById('share-link');

            btn.innerText = "THINKING...";
            btn.disabled = true;

            setTimeout(() => {
                // %50 TEXT, %50 NEXT tam adil olasılık dağılımı
                const isText = Math.random() < 0.5;
                let resultText = "";

                if (isText) {
                    resultText = "TEXT";
                    decisionDiv.className = "decision-text text-style";
                } else {
                    resultText = "NEXT";
                    decisionDiv.className = "decision-text next-style";
                }

                decisionDiv.innerText = resultText;
                
                // Twitter/X Paylaşım linki (Ultra sade global format)
                const tweetText = `I asked textornext.com if I should text my ex. The universe said: ${resultText} 🪐`;
                shareLink.href = `https://twitter.com{encodeURIComponent(tweetText)}&url=${encodeURIComponent(window.location.href)}`;

                resultBox.style.display = "block";
                btn.innerText = "TRY AGAIN";
                btn.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
